<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 UltraAI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <h1>🤖 UltraAI</h1>
        <p>Smart AI Voice Assistant</p>
    </header>

    <!-- Language -->
    <div class="language">
        <select id="languageSelect">
            <option value="hi-IN">🇮🇳 हिन्दी</option>
            <option value="en-US">🇺🇸 English</option>
            <option value="ur-PK">🇵🇰 اردو</option>
            <option value="es-ES">🇪🇸 Español</option>
            <option value="fr-FR">🇫🇷 Français</option>
            <option value="de-DE">🇩🇪 Deutsch</option>
            <option value="ja-JP">🇯🇵 日本語</option>
            <option value="zh-CN">🇨🇳 中文</option>
        </select>
    </div>

    <!-- Status -->
    <div id="status">
        🟢 UltraAI Ready
    </div>

    <!-- Voice Orb -->
    <div id="voiceCircle" onclick="startVoiceMode()">
        🎤
    </div>

    <!-- Chat -->
    <div id="chat" class="chat"></div>

    <!-- Photo Editor -->
    <div class="photo-box">

        <h2>🖼️ UltraAI Photo Editor</h2>

        <input
            type="file"
            id="imageUpload"
            accept="image/*">

        <button onclick="editPhoto()">
            ✨ Edit Photo
        </button>

    </div>

    <!-- PDF Chat -->
    <div class="pdf-box">

        <h2>📄 PDF Chat</h2>

        <input
            type="file"
            id="pdfUpload"
            accept=".pdf"
            onchange="showPDFName()">

        <p id="pdfName"></p>

        <button onclick="uploadPDF()">
            Upload PDF
        </button>

    </div>

    <!-- Bottom -->
    <div class="bottom">

    <button id="plusBtn" onclick="document.getElementById('mediaUpload').click()">
        +
    </button>

    <input
        type="file"
        id="mediaUpload"
        accept="image/*,video/*,.pdf"
        style="display:none;">

    <input
        type="text"
        id="userInput"
        placeholder="कुछ पूछिए..."
        autocomplete="off">

    <button
        id="sendBtn"
        onclick="sendMessage()">
        ➤
    </button>

</div>

    <!-- JavaScript -->
    <script src="script.js"></script>
    <script src="speech.js"></script>
    <script src="ui.js"></script>
    <script src="features.js"></script>
    <script src="pdf.js"></script>
    <script src="photo.js"></script>

</body>

</html>
<div class="bottom">

    <!-- Plus Button -->
    <button id="plusBtn" onclick="document.getElementById('mediaUpload').click()">
        +
    </button>

    <!-- Hidden File Input -->
    <input
        type="file"
        id="mediaUpload"
        accept="image/*,video/*"
        style="display:none;">

    <!-- Text Input -->
    <input
        type="text"
        id="userInput"
        placeholder="कुछ पूछिए..."
        autocomplete="off">

    <!-- Send Button -->
    <button id="sendBtn" onclick="sendMessage()">
        ➤
    </button>

</div>
