<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UltraAI</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
<h1>🤖 UltraAI</h1>
<p>Smart AI Assistant</p>
</header>

<div class="language">
<select id="languageSelect">
<option value="hi-IN">🇮🇳 हिन्दी</option>
<option value="en-US">🇺🇸 English</option>
<option value="ur-PK">🇵🇰 اردو</option>
</select>
</div>

<div id="status">
🟢 UltraAI Ready
</div>

<div id="voiceCircle" onclick="startVoiceMode()">
🎤
</div>

<div id="chat" class="chat"></div>

<div class="bottom">

<button id="plusBtn" onclick="toggleMenu()">
+
</button>

<div id="uploadMenu" class="upload-menu">

<button onclick="document.getElementById('imageUpload').click()">
🖼️ Photo
</button>

<button onclick="document.getElementById('videoUpload').click()">
🎥 Video
</button>

<button onclick="document.getElementById('pdfUpload').click()">
📄 PDF
</button>

</div>

<input type="file" id="imageUpload" accept="image/*" hidden>

<input type="file" id="videoUpload" accept="video/*" hidden>

<input type="file" id="pdfUpload" accept=".pdf" hidden>

<input
id="userInput"
type="text"
placeholder="कुछ पूछिए...">

<button id="sendBtn" onclick="sendMessage()">
➤
</button>

</div>

<script src="script.js"></script>
<script src="speech.js"></script>
<script src="photo.js"></script>
<script src="pdf.js"></script>

</body>
</html>
