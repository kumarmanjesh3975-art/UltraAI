<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>UltraAI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Razorpay -->
    <script
        src="https://checkout.razorpay.com/v1/checkout.js">
    </script>

</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="logo">
            🤖 UltraAI
        </div>

        <select
            id="languageSelect"
            aria-label="Language"
        >

            <option value="hi-IN">
                हिन्दी
            </option>

            <option value="en-US">
                English
            </option>

            <option value="ur-PK">
                اردو
            </option>

            <option value="es-ES">
                Español
            </option>

            <option value="fr-FR">
                Français
            </option>

            <option value="de-DE">
                Deutsch
            </option>

            <option value="ja-JP">
                日本語
            </option>

            <option value="zh-CN">
                中文
            </option>

        </select>

    </header>


    <!-- =========================
         STATUS
    ========================== -->

    <div
        id="status"
        class="status"
    >
        🟢 UltraAI Ready
    </div>


    <!-- =========================
         VOICE
    ========================== -->

    <div
        id="voiceCircle"
        class="voice-circle"
        onclick="startVoiceMode()"
    >
        🎤
    </div>


    <!-- =========================
         CHAT
    ========================== -->

    <main
        id="chat"
        class="chat"
    >
    </main>


    <!-- =========================
         UPLOAD MENU
    ========================== -->

    <div
        id="uploadMenu"
        class="upload-menu"
        style="display:none;"
    >

        <button
            type="button"
            onclick="document.getElementById('imageUpload').click(); toggleMenu();"
        >
            🖼️ Photo
        </button>


        <button
            type="button"
            onclick="document.getElementById('videoUpload').click(); toggleMenu();"
        >
            🎥 Video
        </button>


        <button
            type="button"
            onclick="document.getElementById('pdfUpload').click(); toggleMenu();"
        >
            📄 PDF
        </button>


        <button
            type="button"
            onclick="editPhoto(); toggleMenu();"
        >
            ✨ AI Edit Photo
        </button>

    </div>


    <!-- =========================
         HIDDEN FILE INPUTS
    ========================== -->

    <input
        type="file"
        id="imageUpload"
        accept="image/*"
        hidden
    >

    <input
        type="file"
        id="videoUpload"
        accept="video/*"
        hidden
    >

    <input
        type="file"
        id="pdfUpload"
        accept="application/pdf"
        hidden
    >


    <!-- =========================
         PREMIUM
    ========================== -->

    <section
        id="premiumBox"
        class="premium-box"
    >

        <h2>
            ⭐ UltraAI Premium
        </h2>

        <p>
            Premium features unlock करें।
        </p>

        <button
            type="button"
            onclick="buyPremium()"
        >
            ⭐ Buy Premium ₹199
        </button>

    </section>


    <!-- =========================
         BOTTOM INPUT
    ========================== -->

    <div class="bottom-bar">

        <button
            id="plusBtn"
            class="plus-btn"
            type="button"
            onclick="toggleMenu()"
        >
            ＋
        </button>


        <input
            id="userInput"
            type="text"
            placeholder="UltraAI से पूछें..."
            autocomplete="off"
        >


        <button
            id="micBtn"
            class="mic-btn"
            type="button"
            onclick="startVoiceMode()"
        >
            🎤
        </button>


        <button
            id="sendBtn"
            class="send-btn"
            type="button"
            onclick="sendMessage()"
        >
            ➤
        </button>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="speech.js"></script>

    <script src="languages.js"></script>

    <script src="photo.js"></script>

    <script src="script.js"></script>


</body>

</html>
